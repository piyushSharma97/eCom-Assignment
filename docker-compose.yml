services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    ports:
      - "4380:4380"
    environment:
      NODE_ENV: production
      PORT: "4380"
      MONGODB_URI: mongodb://mongo:27017/ecommerceStore
      CLIENT_ORIGIN: http://localhost:4380
      SEED_ON_START: "true"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
